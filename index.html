<!DOCTYPE html>
<html lang="uk">
<>

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Birb</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/kesha.css">
    <link rel="stylesheet" href="css/checklist.css">
  </head>

  <body>
    <aside class="sidebar">
      <h1>🦜 Birb</h1>
      <span class="versiya">v1.0</span>
      <a class="tab" data-tab="papuha" href="#papuha">🦜 Кешаня</a>
      <a class="tab" data-tab="chekrlist" href="#chekrlist">✅ Чекліст</a>
      <a class="tab" data-tab="shchodennyk" href="#shchodennyk">📔 Щоденник</a>
      <a class="tab" data-tab="nalashtuvannya" href="#nalashtuvannya">⚙️ Налаштування</a>
      <div class="vhid">
        <button id="vhid-knopka">Увійти через Google</button>
        <div id="vhid-info" hidden>
          <span id="vhid-email"></span>
          <button id="vyhid-knopka">Вийти</button>
        </div>
      </div>
    </aside>

    <main class="content">
      <!-- Кешаня -->
      <section id="papuha" class="panel">

        <!-- Список днів -->
        <div id="vyd-spysok">
          <h2>🦜 Кешаня</h2>
          <button class="velykyj" id="novyy-den">Додати новий день +</button>
          <div class="rozdil">
            <h3>Минулі дні:</h3>
            <div id="minuli-dni"></div>
          </div>
        </div>

        <!-- Вибір дати для нового дня -->
        <div id="data-panel" hidden>
          <h2>Новий день</h2>
          <p><input type="date" id="novyj-data"></p>
          <p>
            <button id="novyj-start">Далі</button>
            <button id="novyj-nazad">← Назад</button>
          </p>
        </div>

        <!-- Редактор дня -->
        <div id="redaktor" hidden>
          <div class="shapka">
            <h2>Редактор нового дня</h2>
            <input type="date" id="red-data">
            <button id="red-nazad">← Назад</button>
          </div>

          <div class="redaktor-rjad">
            <div class="livo">
              <div class="blok" id="blok-akt"></div>
              <div class="blok" id="blok-khar"></div>
            </div>
            <div class="pravo">
              <div class="ikony-kol" id="ikony-akt"></div>
              <div class="ikony-kol" id="ikony-khar"></div>
            </div>
          </div>

          <div class="nyzhnij">
            <button id="red-zavershyty">Завершити</button>
          </div>
        </div>
      </section>

      <!-- Чекліст -->
      <section id="chekrlist" class="panel">
        <h2>✅ Чекліст</h2>
        <input type="text" id="nova-sprava" placeholder="Нова справа">
        <button id="dodaty">Додати</button>
        <ul id="chek-list"></ul>
      </section>

      <!-- Щоденник -->
      <section id="shchodennyk" class="panel">
        <h2>📔 Щоденник</h2>
        <p>Тут буде мій щоденник.</p>
      </section>
      <!-- Налаштування -->
      <section id="nalashtuvannya" class="panel">
        <h2>⚙️ Налаштування</h2>
        <p>Тут будуть налаштування.</p>
      </section>
    </main>

    <div id="menu" class="menu" hidden></div>

    <!-- Підтвердження -->
    <div id="potverdzhennya" class="overlay" hidden>
      <div class="vikno-potv">
        <p id="potv-tekst"></p>
        <div class="potv-knopky">
          <button id="potv-ta">Ага</button>
          <button id="potv-ni">Нє</button>
        </div>
      </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/cloud.js"></script>
    <script src="js/app.js"></script>
    <script src="js/checklist.js"></script>
    <script src="js/kesha/storage.js"></script>
    <script src="js/kesha/days.js"></script>
    <script src="js/kesha/editor.js"></script>
    <script src="js/kesha/days.js"></script>
    <script src="js/kesha/icons.js"></script>
  </body>

</html>
